
<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業線上題庫測驗系統</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        h2 {
            color: #2c3e50;
            margin-top: 0;
        }

        h3 {
            color: #2c3e50;
            margin-top: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        select,
        input[type="number"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #3498db;
            color: white;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #2980b9;
        }

        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #95a5a6;
            margin-bottom: 15px;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .option-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
            text-align: left;
            transition: all 0.2s;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .option-btn:hover:not(:disabled) {
            background: #f0f4f8;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 1;
        }

        .correct {
            background: #d4edda !important;
            border-color: #c3e6cb;
            color: #155724;
            font-weight: bold;
        }

        .wrong {
            background: #f8d7da !important;
            border-color: #f5c6cb;
            color: #721c24;
        }

        .hidden {
            display: none !important;
        }

        .chapter-tag {
            display: inline-block;
            background: #e8f4fd;
            color: #2980b9;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stats {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 15px;
        }

        .star-btn {
            display: inline-block;
            margin-bottom: 15px;
            padding: 8px 14px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #f1c40f;
            border-radius: 6px;
            background: #fffdf0;
            color: #b7950b;
        }

        .star-btn.active {
            background: #fff1a8;
            color: #8a6d00;
            font-weight: bold;
        }

        .next-btn {
            margin-top: 20px;
        }

        .result-message {
            font-weight: bold;
            margin-top: 15px;
            line-height: 1.7;
        }

        .review-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            background: #fafafa;
        }

        .review-card h4 {
            margin-top: 0;
            color: #2c3e50;
            line-height: 1.6;
        }

        .review-option {
            padding: 8px;
            margin: 5px 0;
            border-radius: 5px;
            background: white;
            border: 1px solid #eee;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .review-correct {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }

        .review-wrong {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }

        .review-info {
            margin-top: 12px;
            line-height: 1.8;
            font-size: 14px;
        }

        .review-section {
            margin-top: 25px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .empty-message {
            color: #7f8c8d;
            background: #f4f6f9;
            padding: 15px;
            border-radius: 6px;
        }

        .summary {
            background: #f4f6f9;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.8;
            margin: 20px 0;
        }

        .explanation {
            background: #fff8e1;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            line-height: 1.7;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="card">

    <!-- 1. 首頁設定區 -->
    <div id="setup-screen">

        <h2>🚀 線上題庫測驗系統</h2>

        <p style="color: #666; margin-bottom: 20px;">
            請依序選擇考試節次、章節及測驗模式：
        </p>

        <div class="form-group">
            <label for="session-select">
                ① 選擇考試節次：
            </label>

            <select id="session-select" onchange="initChapterSelect()">
                <option value="first">
                    第一節考試（第一章～第四章）
                </option>

                <option value="second">
                    第二節考試（第五章～第十章）
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="chapter-select">
                ② 選擇測驗分類（章節）：
            </label>

            <select id="chapter-select">
                <option value="all">載入中...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="mode-select">
                ③ 選擇測驗模式：
            </label>

            <select id="mode-select" onchange="toggleCountGroup()">
                <option value="sequential">依順序完整練習</option>
                <option value="random">隨機抽題測驗</option>
            </select>
        </div>

        <div class="form-group" id="count-group">
            <label for="question-count">
                出題數量（若選隨機）：
            </label>

            <input
                type="number"
                id="question-count"
                value="20"
                min="1"
                max="500"
            >
        </div>

        <button class="btn" onclick="startQuiz()">
            開始測驗
        </button>

    </div>


    <!-- 2. 測驗畫面 -->
    <div id="quiz-screen" class="hidden">

        <button class="btn btn-secondary" onclick="goHome()">
            🏠 返回首頁重新選擇
        </button>

        <div class="stats" id="quiz-stats"></div>

        <div id="chapter-badge" class="chapter-tag"></div>

        <h2 id="question-title"></h2>

        <button
            id="star-btn"
            class="star-btn"
            onclick="toggleStar()"
        >
            ☆ 收藏這題
        </button>

        <div id="options-container"></div>

        <p id="result" class="result-message"></p>

        <button
            id="next-btn"
            class="btn next-btn"
            onclick="nextQuestion()"
            disabled
        >
            請先作答
        </button>

    </div>


    <!-- 3. 測驗結算及複習畫面 -->
    <div id="result-screen" class="hidden">

        <h2>🎉 測驗已全部完成！</h2>

        <div id="final-score" class="summary"></div>

        <div class="review-section">
            <h3>❌ 錯題複習</h3>
            <div id="wrong-review"></div>
        </div>

        <div class="review-section">
            <h3>⭐ 我的收藏題目</h3>
            <div id="star-review"></div>
        </div>

        <button
            class="btn"
            onclick="goHome()"
            style="margin-top: 25px;"
        >
            🏠 返回首頁重新測驗
        </button>

    </div>

</div>


<script>

    let allQuestions = [];
    let activeQuestions = [];
    let currentIndex = 0;
    let score = 0;

    let answeredQuestions = [];
    let wrongQuestions = [];
    let starredQuestions = new Set();


    // 考試節次與章節對應
    const sessionChapters = {

        first: [
            "第一章",
            "第二章",
            "第三章",
            "第四章"
        ],

        second: [
            "第五章",
            "第六章",
            "第七章",
            "第八章",
            "第九章",
            "第十章"
        ]

    };


    // 載入題庫
    fetch('questions.json')

        .then(response => {

            if (!response.ok) {
                throw new Error("找不到 questions.json");
            }

            return response.json();

        })

        .then(data => {

            if (!Array.isArray(data)) {
                throw new Error("題庫格式必須是 JSON 陣列");
            }

            allQuestions = data;

            initChapterSelect();

            toggleCountGroup();

        })

        .catch(error => {

            console.error('讀取題庫失敗:', error);

            alert(
                '載入題庫失敗，請確認 questions.json 是否存在與格式正確。'
            );

        });


    // 隨機模式才顯示出題數量
    function toggleCountGroup() {

        const mode =
            document.getElementById('mode-select').value;

        document.getElementById('count-group')
            .classList.toggle('hidden', mode !== 'random');

    }


    // 依照考試節次更新章節選單
    function initChapterSelect() {

        const session =
            document.getElementById('session-select').value;

        const select =
            document.getElementById('chapter-select');

        const allowedChapters = sessionChapters[session];

        const filteredQuestions = allQuestions.filter(q => {

            const category = q.category || q.chapter || "";

            return allowedChapters.some(chapter =>
                category.startsWith(chapter)
            );

        });

        const categories = [
            ...new Set(
                filteredQuestions.map(q =>
                    q.category || q.chapter || "預設分類"
                )
            )
        ];

        select.innerHTML = "";

        const allOption = document.createElement('option');

        allOption.value = "all";
        allOption.textContent = "本節全部章節混合測驗";

        select.appendChild(allOption);

        categories.forEach(cat => {

            const option = document.createElement('option');

            option.value = cat;
            option.textContent = cat;

            select.appendChild(option);

        });

    }


    // 開始測驗
    function startQuiz() {

        if (allQuestions.length === 0) {

            alert('題庫尚在載入中或沒有題目。');

            return;

        }

        const session =
            document.getElementById('session-select').value;

        const selectedCategory =
            document.getElementById('chapter-select').value;

        const mode =
            document.getElementById('mode-select').value;

        const countInput = parseInt(
            document.getElementById('question-count').value
        ) || 20;

        const allowedChapters = sessionChapters[session];

        // 先依節次篩選
        let filtered = allQuestions.filter(q => {

            const category = q.category || q.chapter || "";

            return allowedChapters.some(chapter =>
                category.startsWith(chapter)
            );

        });

        // 再依章節篩選
        if (selectedCategory !== "all") {

            filtered = filtered.filter(q =>
                (q.category || q.chapter || "預設分類")
                === selectedCategory
            );

        }

        if (filtered.length === 0) {

            alert('目前選擇的範圍沒有題目！');

            return;

        }

        // 隨機抽題
        if (mode === 'random') {

            filtered = shuffleArray(filtered);

            const amount = Math.max(
                1,
                Math.min(countInput, filtered.length)
            );

            activeQuestions = filtered.slice(0, amount);

        } else {

            activeQuestions = filtered;

        }

        currentIndex = 0;
        score = 0;

        answeredQuestions = [];
        wrongQuestions = [];
        starredQuestions = new Set();

        document.getElementById('setup-screen')
            .classList.add('hidden');

        document.getElementById('result-screen')
            .classList.add('hidden');

        document.getElementById('quiz-screen')
            .classList.remove('hidden');

        showQuestion();

    }


    // 隨機洗牌
    function shuffleArray(array) {

        const result = [...array];

        for (let i = result.length - 1; i > 0; i--) {

            const j = Math.floor(Math.random() * (i + 1));

            [result[i], result[j]] =
                [result[j], result[i]];

        }

        return result;

    }


    // 返回首頁
    function goHome() {

        document.getElementById('quiz-screen')
            .classList.add('hidden');

        document.getElementById('result-screen')
            .classList.add('hidden');

        document.getElementById('setup-screen')
            .classList.remove('hidden');

    }


    // 取得純題幹：移除題目中重複的選項文字
    function getQuestionOnly(q) {

        let questionText = String(q.question || "");

        if (Array.isArray(q.options)) {

            q.options.forEach(option => {

                const optionText = String(option).trim();

                if (optionText) {

                    // 移除題幹中與選項完全相同的文字
                    questionText = questionText
                        .split(optionText)
                        .join("");

                }

            });

        }

        // 清理多餘空白、空行及尾端標點
        questionText = questionText
            .replace(/[ \t]+\n/g, "\n")
            .replace(/\n{2,}/g, "\n")
            .trim();

        return questionText;

    }


    // 顯示目前題目
    function showQuestion() {

        const q = activeQuestions[currentIndex];

        document.getElementById('quiz-stats').innerText =
            `總進度：第 ${currentIndex + 1} 題 / 共 ${activeQuestions.length} 題`;

        const categoryName =
            q.category || q.chapter || "預設分類";

        const originalId = q.id
            ? ` (第 ${q.id} 題)`
            : "";

        document.getElementById('chapter-badge').innerText =
            `📂 ${categoryName}${originalId}`;

        // 只顯示題幹，不顯示重複選項
        document.getElementById('question-title').innerText =
            getQuestionOnly(q);

        document.getElementById('result').innerText = "";

        const nextBtn = document.getElementById('next-btn');

        nextBtn.disabled = true;
        nextBtn.innerText = "請先作答";

        updateStarButton();

        const container =
            document.getElementById('options-container');

        container.innerHTML = "";

        // 顯示 JSON 原本的選項，不額外加編號
        q.options.forEach((option, index) => {

            const btn = document.createElement('button');

            btn.className = 'option-btn';

            btn.innerText = option;

            btn.onclick = () =>
                checkAnswer(index, q.answer, btn, q.options);

            container.appendChild(btn);

        });

    }


    // 星號收藏
    function toggleStar() {

        const q = activeQuestions[currentIndex];

        if (starredQuestions.has(q)) {

            starredQuestions.delete(q);

        } else {

            starredQuestions.add(q);

        }

        updateStarButton();

    }


    // 更新星號按鈕
    function updateStarButton() {

        const q = activeQuestions[currentIndex];

        const btn = document.getElementById('star-btn');

        if (starredQuestions.has(q)) {

            btn.innerText = "★ 已收藏此題";

            btn.classList.add('active');

        } else {

            btn.innerText = "☆ 收藏這題";

            btn.classList.remove('active');

        }

    }


    // 檢查答案
    function checkAnswer(selected, correct, btn, options) {

        const buttons = document.querySelectorAll(
            '#options-container button'
        );

        // 防止重複作答
        buttons.forEach(b => b.disabled = true);

        const q = activeQuestions[currentIndex];

        const resultEl = document.getElementById('result');

        const isCorrect = selected === correct;

        const record = {
            question: q,
            selected: selected,
            correct: correct,
            isCorrect: isCorrect
        };

        answeredQuestions.push(record);

        if (isCorrect) {

            btn.classList.add('correct');

            resultEl.innerText = "回答正確！";

            resultEl.style.color = "#27ae60";

            score++;

        } else {

            btn.classList.add('wrong');

            if (
                Number.isInteger(correct) &&
                buttons[correct]
            ) {

                buttons[correct].classList.add('correct');

            }

            resultEl.innerText =
                "回答錯誤！正確答案是：" +
                (options[correct] ?? "答案資料異常");

            resultEl.style.color = "#c0392b";

            wrongQuestions.push(record);

        }

        // 作答完成後才開放下一題
        const nextBtn = document.getElementById('next-btn');

        nextBtn.disabled = false;

        if (currentIndex < activeQuestions.length - 1) {

            nextBtn.innerText = "下一題 ➜";

        } else {

            nextBtn.innerText = "完成測驗並查看結果";

        }

    }


    // 手動進入下一題
    function nextQuestion() {

        const q = activeQuestions[currentIndex];

        const hasAnswered = answeredQuestions.some(
            record => record.question === q
        );

        if (!hasAnswered) {

            alert('請先選擇答案，再進入下一題！');

            return;

        }

        currentIndex++;

        if (currentIndex < activeQuestions.length) {

            showQuestion();

        } else {

            showFinalResult();

        }

    }


    // 顯示測驗結果
    function showFinalResult() {

        document.getElementById('quiz-screen')
            .classList.add('hidden');

        document.getElementById('result-screen')
            .classList.remove('hidden');

        const total = activeQuestions.length;

        const percentage = Math.round(
            (score / total) * 100
        );

        document.getElementById('final-score').innerHTML =
            `本次測驗完成 <strong>${total}</strong> 題。<br>
             答對 <strong>${score}</strong> 題。<br>
             答錯 <strong>${wrongQuestions.length}</strong> 題。<br>
             收藏 <strong>${starredQuestions.size}</strong> 題。<br>
             正確率 <strong>${percentage}%</strong>。`;

        // 顯示錯題
        renderReview(
            wrongQuestions,
            'wrong-review',
            '恭喜！本次測驗沒有答錯題目。'
        );

        // 顯示收藏題目
        const starredRecords = answeredQuestions.filter(
            record => starredQuestions.has(record.question)
        );

        renderReview(
            starredRecords,
            'star-review',
            '本次沒有收藏任何題目。'
        );

    }


    // 建立錯題及收藏題目的複習內容
    function renderReview(records, containerId, emptyText) {

        const container =
            document.getElementById(containerId);

        container.innerHTML = "";

        if (records.length === 0) {

            const empty = document.createElement('p');

            empty.className = 'empty-message';

            empty.innerText = emptyText;

            container.appendChild(empty);

            return;

        }

        records.forEach((record, index) => {

            const q = record.question;

            const card = document.createElement('div');

            card.className = 'review-card';

            // 複習區只顯示題幹
            const title = document.createElement('h4');

            title.innerText =
                `${index + 1}. ${q.category || q.chapter || ""} ${getQuestionOnly(q)}`;

            card.appendChild(title);

            // 顯示所有選項
            q.options.forEach((option, optionIndex) => {

                const optionEl = document.createElement('div');

                optionEl.className = 'review-option';

                optionEl.innerText = option;

                // 標示正確答案
                if (optionIndex === record.correct) {

                    optionEl.classList.add('review-correct');

                    optionEl.innerText += "  ✓ 正確答案";

                }

                // 標示使用者選錯的答案
                if (
                    !record.isCorrect &&
                    optionIndex === record.selected
                ) {

                    optionEl.classList.add('review-wrong');

                    optionEl.innerText += "  ✗ 你的選擇";

                }

                card.appendChild(optionEl);

            });

            // 答題資訊
            const info = document.createElement('div');

            info.className = 'review-info';

            const correctText =
                q.options[record.correct] ?? "答案資料異常";

            const selectedText =
                q.options[record.selected] ?? "未作答";

            info.innerHTML =
                `<strong>你的答案：</strong>${escapeHTML(selectedText)}<br>
                 <strong>正確答案：</strong>${escapeHTML(correctText)}<br>
                 <strong>作答結果：</strong>
                 ${record.isCorrect ? "答對" : "答錯"}`;

            card.appendChild(info);

            // 題庫有解析才顯示
            const explanation =
                q.explanation ||
                q.explain ||
                q.analysis ||
                q.解析;

            if (explanation) {

                const explanationEl =
                    document.createElement('div');

                explanationEl.className = 'explanation';

                const explanationTitle =
                    document.createElement('strong');

                explanationTitle.innerText = "📖 題目解析：";

                const explanationText =
                    document.createElement('div');

                explanationText.innerText = explanation;

                explanationEl.appendChild(explanationTitle);

                explanationEl.appendChild(explanationText);

                card.appendChild(explanationEl);

            }

            container.appendChild(card);

        });

    }


    // 避免題目文字被當成 HTML 執行
    function escapeHTML(text) {

        const div = document.createElement('div');

        div.textContent = String(text);

        return div.innerHTML;

    }

</script>

</body>
</html>
